<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vps Chill</title>
<meta name="description" content="Chill es una tienda de vapers en Corrientes. Productos originales, asesoramiento para elegir y envío coordinado por WhatsApp a capital y el interior. Solo para mayores de 18.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#171717">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: vidriera en verde bosque con producto sobre gris niebla; la nube con contorno negro es el único recurso gráfico; menta solo para acción y sellos */
:root{
  --forest:#1F3D33;      /* fondo principal (banners del kit) */
  --forest-2:#25483C;    /* superficie elevada sobre forest */
  --forest-3:#2D5547;    /* hover / controles */
  --line:#35594C;        /* divisores sobre forest */
  --black:#171717;       /* header, footer, contorno */
  --black-2:#212322;
  --fg:#F2F7F5;          /* texto sobre oscuro */
  --muted:#B3CBC1;       /* texto secundario sobre forest (7:1) */
  --dim:#8BA79C;         /* notas finas (4.6:1) */
  --mint:#CEF4E5;        /* color de marca: la nube */
  --mint-strong:#88D7B7; /* botones y CTA */
  --on-mint:#171717;
  --fog:#ECECEC;         /* fondo de producto */
  --fog-2:#E1E3E2;
  --fog-ink:#171717;
  --fog-muted:#5A605D;
  --danger:#F08A7E;
  --pending:#E9CF8A;
  --pending-on-light:#7A5A12;

  --f-display:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

  --r-sm:8px; --r-md:20px; --r-lg:28px; --r-pill:999px;
  --outline:3px;
  --hdr-h:68px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr-h) + 16px)}
body{background:var(--forest);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--black)}
html.lock,html.lock body{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%;height:auto}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--mint-strong);outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}

.wrap{width:100%;max-width:1320px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:768px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding-inline:26px;border-radius:var(--r-pill);font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.005em;transition:background-color .2s,color .2s,transform .2s var(--ease),box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--mint-strong);color:var(--on-mint);box-shadow:0 0 0 var(--outline) var(--black)}
.btn-primary:hover{background:var(--mint)}
.btn-secondary{background:var(--forest-3);color:var(--fg)}
.btn-secondary:hover{background:#365F51}
.btn-ghost{color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 2px var(--mint-strong)}
.btn-ink{background:var(--black);color:var(--fg)}
.btn-ink:hover{background:var(--black-2)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding-inline:18px;font-size:15px}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16px;min-height:44px}
.link-arrow svg{transition:transform .25s var(--ease)}
.link-arrow:hover svg{transform:translateX(4px)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--fg);position:relative;flex:none;transition:background-color .2s}
.icon-btn:hover{background:var(--black-2)}

/* ---------- Franja +18 ---------- */
.topstrip{background:var(--mint);color:var(--on-mint);font-size:13px;font-weight:700}
.topstrip .wrap{display:flex;justify-content:center;gap:8px 18px;flex-wrap:wrap;padding-block:7px;text-align:center}
.topstrip b{font-weight:800}

/* ---------- Header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--black)}
.hdr-row{display:flex;align-items:center;gap:6px;height:var(--hdr-h)}
.logo{display:flex;align-items:center;flex:none;padding:4px;margin-left:-4px;border-radius:10px}
.logo img{height:46px;width:auto}
.nav{display:none;gap:2px;margin-left:24px}
.nav a{display:inline-flex;align-items:center;height:40px;padding-inline:14px;border-radius:var(--r-pill);color:var(--muted);font-weight:700;font-size:15px;transition:color .2s,background-color .2s}
.nav a:hover{color:var(--fg);background:var(--black-2)}
.nav a[aria-current="page"]{color:var(--on-mint);background:var(--mint)}
.hdr-search{display:none;position:relative;flex:1;max-width:380px;margin-left:auto}
.hdr-search input{width:100%;height:44px;border-radius:var(--r-pill);background:var(--black-2);border:2px solid transparent;padding:0 16px 0 44px;font-size:15px;color:var(--fg)}
.hdr-search input::placeholder{color:var(--dim)}
.hdr-search input:focus{outline:none;border-color:var(--mint-strong)}
.field-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none;display:flex}
.hdr-actions{display:flex;gap:2px;margin-left:auto}
.badge-count{position:absolute;top:4px;right:2px;min-width:20px;height:20px;border-radius:10px;background:var(--mint-strong);color:var(--on-mint);font:800 11px/20px var(--f-body);text-align:center;padding-inline:5px;box-shadow:0 0 0 2px var(--black)}
.badge-count.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.3)}}
@media(min-width:960px){
  .nav{display:flex}
  .hdr-search{display:block}
  .only-mobile{display:none!important}
  .hdr-actions{margin-left:12px}
}

/* Sugerencias de búsqueda */
.suggest{position:absolute;top:calc(100% + 10px);left:0;right:0;background:var(--black-2);border-radius:var(--r-md);padding:8px;z-index:5;box-shadow:0 24px 48px -24px rgba(0,0,0,.7);max-height:70vh;overflow:auto}
.sug-row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px}
.sug-row:hover,.sug-row:focus-visible{background:var(--forest-2)}
.sug-thumb{width:48px;height:48px;border-radius:12px;background:var(--fog);flex:none;display:grid;place-items:center;padding:5px}
.sug-thumb img{width:100%;height:100%;object-fit:contain}
.sug-name{font-weight:700;font-size:15px;line-height:1.25}
.sug-name mark{background:none;color:var(--mint-strong)}
.sug-sub{display:block;font-size:13px;color:var(--muted);font-weight:600}
.sug-all{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 10px 8px;font-size:14px;font-weight:700;color:var(--mint-strong);min-height:44px}
.sug-empty{padding:14px 10px;color:var(--muted);font-size:15px}
.sug-label{padding:8px 10px 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.sug-chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 8px 8px}

/* ---------- Hero ---------- */
.hero{position:relative;background:var(--forest);overflow:hidden;display:flex;flex-direction:column}
.hero-media{order:2}
.hero-copy{display:grid;gap:18px;justify-items:start;padding-block:36px 8px}
.hero h1{font-weight:700;font-size:clamp(46px,7vw,92px);line-height:.95;letter-spacing:-.01em}
.hero-lead{font-size:clamp(17px,1.5vw,21px);color:var(--mint);max-width:30ch;line-height:1.45;font-weight:600}
.hero-fine{font-size:13px;color:var(--dim);font-weight:700}
.hero-media{display:block;max-width:560px;margin-inline:auto}
.hero-media img{width:100%;aspect-ratio:900/880;object-fit:cover;object-position:center bottom}
@media(min-width:1100px){
  .hero{min-height:37.5vw;max-height:720px;display:flex;align-items:center}
  .hero-media{position:absolute;inset:0;max-width:none;margin:0}
  .hero-media img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;object-position:right center}
  .hero .wrap{position:relative;z-index:1}
  .hero-copy{padding-block:48px;max-width:min(46vw,620px)}
}
.reveal{animation:rise .7s var(--ease) both}
.reveal-2{animation-delay:.08s}.reveal-3{animation-delay:.16s}.reveal-4{animation-delay:.24s}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

/* ---------- Secciones ---------- */
.sec{padding-top:clamp(56px,7vw,96px)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-strong);margin-bottom:8px}
.h2{font-size:clamp(30px,3.6vw,46px);font-weight:600;letter-spacing:-.005em}
.lead{font-size:18px;color:var(--muted);max-width:52ch}

/* Bloques de marca */
.brands{display:grid;gap:14px}
@media(min-width:860px){.brands{grid-template-columns:1.15fr 1fr}}
.brand-tile{position:relative;display:grid;grid-template-rows:auto 1fr;min-height:420px;border-radius:var(--r-lg);overflow:hidden;padding:28px;isolation:isolate}
.brand-tile.fog{background:var(--fog);color:var(--fog-ink)}
.brand-tile.mint{background:var(--mint);color:var(--on-mint);box-shadow:inset 0 0 0 var(--outline) var(--black)}
.brand-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand-name{font-size:clamp(34px,4vw,52px);font-weight:700;line-height:1}
.brand-meta{margin-top:8px;font-weight:700;color:var(--fog-muted);font-size:15px}
.brand-go{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--black);color:var(--fg);transition:transform .3s var(--ease)}
.brand-tile:hover .brand-go{transform:translateX(4px) rotate(-8deg)}
.brand-imgs{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:0;margin-top:16px;min-height:240px}
.brand-imgs img{max-height:300px;width:auto;object-fit:contain;filter:drop-shadow(0 22px 22px rgba(23,23,23,.2));transition:transform .7s var(--ease)}
.brand-imgs img:nth-child(1){max-width:58%}
.brand-imgs img:nth-child(2){max-width:44%;margin-left:-6%;max-height:230px}
.brand-tile:hover .brand-imgs img:nth-child(1){transform:translateY(-6px)}
.brand-tile:hover .brand-imgs img:nth-child(2){transform:translateY(-10px)}
.brand-count{position:absolute;left:28px;bottom:24px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fog-muted)}

/* ---------- Tarjeta de producto ---------- */
.grid-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}
@media(min-width:760px){.grid-products{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 18px}}
@media(min-width:1100px){.grid-products.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcard{display:flex;flex-direction:column;gap:14px;min-width:0}
.pcard-mediawrap{position:relative}
.pcard-media{display:block;aspect-ratio:1/1;border-radius:var(--r-md);background:var(--fog);padding:14%;overflow:hidden}
.pcard-media img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 16px rgba(23,23,23,.18));transition:transform .6s var(--ease)}
.pcard:hover .pcard-media img{transform:translateY(-4px) scale(1.03)}
.pcard-tags{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:26px;padding-inline:10px;border-radius:var(--r-pill);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--black);color:var(--fg)}
.tag-mint{background:var(--mint-strong);color:var(--on-mint)}
.quick-add{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--mint-strong);color:var(--on-mint);display:grid;place-items:center;box-shadow:0 0 0 var(--outline) var(--black);transition:transform .25s var(--ease),opacity .25s,background-color .2s}
.quick-add:hover{background:var(--mint)}
@media(hover:hover){.quick-add{opacity:0;transform:translateY(6px)}.pcard:hover .quick-add,.pcard:focus-within .quick-add{opacity:1;transform:none}}
.pcard-body{display:grid;gap:4px;padding-inline:2px}
.pcard-brand{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.pcard-name{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.15}
.pcard-name a:hover{color:var(--mint)}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:2px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price-now{font-weight:800;font-size:17px}
.price-old{color:var(--dim);font-size:14px}
.price-ask{font-weight:700;font-size:15px;color:var(--mint)}
.stock{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--mint-strong)}.dot.low{background:var(--pending)}.dot.out{background:var(--danger)}
.dot.unknown{background:transparent;box-shadow:inset 0 0 0 2px var(--dim)}

/* Destacados: carrusel en móvil */
@media(max-width:759px){
  .rail{display:grid;grid-auto-flow:column;grid-auto-columns:68%;grid-template-columns:none;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:start}
}

/* ---------- Spotlight editorial ---------- */
.spot{display:grid;border-radius:var(--r-lg);background:var(--black);overflow:hidden}
@media(min-width:860px){.spot{grid-template-columns:1.2fr 1fr;align-items:center}}
.spot-art{position:relative;display:grid;place-items:center;padding:32px 20px 12px;min-height:300px}
.spot-art .cloud{position:absolute;width:min(92%,560px);height:auto;inset:auto;z-index:0}
.spot-art img{position:relative;z-index:1;width:min(88%,520px);filter:drop-shadow(0 26px 24px rgba(0,0,0,.35))}
.spot-copy{display:grid;gap:16px;justify-items:start;padding:20px 28px 36px}
@media(min-width:860px){.spot-copy{padding:48px 48px 48px 8px}.spot-art{padding:48px 24px;min-height:440px}}

/* ---------- Cómo comprar ---------- */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:step}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.step{display:grid;gap:12px;align-content:start;padding:24px;border-radius:var(--r-md);background:var(--forest-2);counter-increment:step}
.step::before{content:counter(step);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--on-mint);font:700 20px/1 var(--f-display);box-shadow:0 0 0 var(--outline) var(--black)}
.step h3{font-size:22px}
.step p{color:var(--muted)}

/* ---------- Servicios (superficie clara) ---------- */
.services{margin-top:clamp(56px,7vw,96px);background:var(--fog);color:var(--fog-ink)}
.services .wrap{padding-block:clamp(48px,6vw,80px)}
.services .eyebrow{color:#2A7055}
.svc-grid{list-style:none;margin:0;padding:0;display:grid;gap:28px 24px}
@media(min-width:560px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.svc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.svc{display:grid;gap:8px;align-content:start;padding-top:20px;border-top:2px solid var(--fog-ink)}
.svc-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--on-mint);box-shadow:0 0 0 2px var(--black)}
.svc h3{font-size:21px;margin-top:6px}
.svc p{color:var(--fog-muted);font-size:15px;max-width:34ch}
.pending{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pending)}
.pending::before{content:"";width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor}
.services .pending,.on-light .pending{color:var(--pending-on-light)}

/* ---------- Footer ---------- */
.ftr{background:var(--black);color:var(--fg)}
.ftr .wrap{padding-block:56px 28px}
.ftr-grid{display:grid;gap:36px 24px;grid-template-columns:repeat(2,minmax(0,1fr))}
.ftr-brand{grid-column:1/-1;display:grid;gap:16px;max-width:40ch}
.ftr-brand img{height:72px;width:auto}
.ftr-brand p{color:var(--muted);font-size:15px}
@media(min-width:900px){.ftr-grid{grid-template-columns:1.6fr repeat(3,minmax(0,1fr))}.ftr-brand{grid-column:auto}}
.ftr h2{font-family:var(--f-body);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:15px}
.ftr ul a{display:inline-flex;align-items:center;gap:8px;min-height:36px;color:var(--muted);font-weight:600}
.ftr ul a:hover{color:var(--fg)}
.ftr-warn{margin-top:44px;padding:16px 20px;border-radius:var(--r-md);background:var(--black-2);display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);font-weight:600}
.ftr-warn b{color:var(--fg)}
.ftr-bottom{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid #2B2D2C;font-size:13px;color:var(--dim)}
.ftr-legal{display:flex;flex-wrap:wrap;gap:6px 18px}
.ftr-legal a:hover{color:var(--fg)}

/* ---------- Catálogo ---------- */
.page-pad{padding-block:28px 88px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:14px}
.crumbs a:hover{color:var(--fg)}
.crumbs [aria-current]{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.page-h1{font-size:clamp(36px,4.6vw,58px);font-weight:700}
.cat-title{display:flex;align-items:baseline;gap:8px 18px;flex-wrap:wrap;margin-bottom:22px}
.cat-title p{font-weight:700;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.field{position:relative;flex:1 1 100%;min-width:0}
.field input{width:100%;height:50px;border-radius:var(--r-pill);background:var(--forest-2);border:2px solid transparent;padding:0 18px 0 46px;font-size:16px;color:var(--fg)}
.field input::placeholder{color:var(--dim)}
.field input:focus{outline:none;border-color:var(--mint-strong)}
.select{position:relative;flex:1 1 auto}
.select select{appearance:none;-webkit-appearance:none;width:100%;height:50px;border-radius:var(--r-pill);background:var(--forest-2);border:2px solid transparent;padding:0 44px 0 18px;font-size:15px;font-weight:700;color:var(--fg);cursor:pointer}
.select select:focus{outline:none;border-color:var(--mint-strong)}
.select svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.btn-filters{flex:1 1 auto;min-height:50px}

/* La nube con contorno negro: el recurso gráfico de la marca */
function cloud(fill = 'var(--mint)', outline = 'var(--black)', sw = 8) {
  const C = [[104, 176, 70], [174, 120, 86], [262, 114, 78], [320, 172, 64], [258, 210, 72], [168, 212, 72]];
  const ring = C.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + sw}"/>`).join('');
  const body = C.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
  return `<svg class="cloud" viewBox="0 0 420 300" aria-hidden="true" focusable="false"><g style="fill:${outline}">${ring}</g><g style="fill:${fill}">${body}</g></svg>`;
}

/* --- Catálogo --- */
function filtered() {
  const f = state.filters;
  const terms = norm(f.q).split(/\s+/).filter(Boolean);
  const bucket = PRICE_BUCKETS.find(b => b.id === f.price) || PRICE_BUCKETS[0];
  let list = (state.products || []).filter(p => {
    if (terms.length) { const hay = norm(`${p.name} ${brandName(p.brand)} ${p.desc}`); if (!terms.every(t => hay.includes(t))) return false; }
    if (f.brand !== 'all' && p.brand !== f.brand) return false;
    if (f.price !== 'all' && (!hasPrice(p) || !bucket.test(effPrice(p)))) return false;
    if (f.stock && !(typeof p.stock === 'number' && p.stock > 0)) return false;
    return true;
  });
  const by = {
    relevance: (a, b) => a.rank - b.rank,
    name: (a, b) => a.name.localeCompare(b.name, 'es'),
    'price-asc': (a, b) => (hasPrice(a) ? effPrice(a) : Infinity) - (hasPrice(b) ? effPrice(b) : Infinity),
    'price-desc': (a, b) => (hasPrice(b) ? effPrice(b) : -Infinity) - (hasPrice(a) ? effPrice(a) : -Infinity),
  }[f.sort] || ((a, b) => a.rank - b.rank);
  return list.sort(by);
}
function sortOptions() {
  const o = [['relevance', 'Recomendados'], ['name', 'Nombre (A–Z)']];
  if (anyPrice()) o.push(['price-asc', 'Menor precio'], ['price-desc', 'Mayor precio']);
  return o;

/* --- Pedido --- */
function cartLines() { return state.cart.map(l => ({ l, p: (state.products || PRODUCTS).find(x => x.id === l.id) })).filter(x => x.p); }
const lineKey = l => `${l.id}__${l.flavor || ''}`;
const cartCount = () => state.cart.reduce((a, l) => a + l.qty, 0);
function totals() {
  const lines = cartLines();
  const priced = lines.every(({ p }) => hasPrice(p));
  const subtotal = lines.reduce((a, { l, p }) => a + (hasPrice(p) ? effPrice(p) * l.qty : 0), 0);
  const savings = lines.reduce((a, { l, p }) => a + (hasPrice(p) && typeof p.promo === 'number' ? (p.price - p.promo) * l.qty : 0), 0);
  return { lines, priced, subtotal, savings };
}
function lineHTML({ l, p }) {
  const k = esc(lineKey(l));
  const max = typeof p.stock === 'number' ? p.stock : 20;
  return `<li class="line">
    <a href="#producto-${p.id}" class="line-thumb" tabindex="-1" aria-hidden="true"><img src="${p.img}" alt="" loading="lazy"></a>
    <div class="line-info">
      <a href="#producto-${p.id}" class="line-name">${esc(p.name)}</a>
      <span class="line-var">${l.flavor ? `Sabor: ${esc(l.flavor)}` : 'Sabor a elegir'}</span>
      <div class="line-ctrl">
        <div class="qty qty-sm" role="group" aria-label="Cantidad de ${esc(p.name)}">
          <button data-action="line-dec" data-key="${k}" ${l.qty <= 1 ? 'disabled' : ''} aria-label="Restar una unidad">${icon('minus', 16)}</button>
          <output>${l.qty}</output>
          <button data-action="line-inc" data-key="${k}" ${l.qty >= max ? 'disabled' : ''} aria-label="Sumar una unidad">${icon('plus', 16)}</button>
        </div>
        <button class="line-rm" data-action="line-rm" data-key="${k}">Eliminar</button>
      </div>
    </div>
    <div class="line-price">${hasPrice(p) ? money(effPrice(p) * l.qty) : '<span class="price-ask">A consultar</span>'}</div>
  </li>`;
}
function summaryHTML() {
  const t = totals();
  return `<div class="sum">
    <div class="sum-row"><span>Productos</span><span>${plural(cartCount(), 'unidad', 'unidades')}</span></div>
    ${t.subtotal ? `<div class="sum-row"><span>Subtotal${t.priced ? '' : ' (con precio)'}</span><span>${money(t.subtotal)}</span></div>` : ''}
    ${t.savings ? `<div class="sum-row"><span>Descuentos</span><span>−${money(t.savings)}</span></div>` : ''}
    <div class="sum-row"><span>Envío</span><span>A coordinar</span></div>
    <div class="sum-row sum-total"><span>Total</span><span>${t.priced && t.lines.length ? money(t.subtotal) : 'Se confirma por WhatsApp'}</span></div>
  </div>`;
}
function emptyCartHTML() {

function orderMessage(data) {

  return [
    'Hola Chill! Quiero hacer este pedido:', items,
    t.priced && t.lines.length ? `Total: ${money(t.subtotal)}` : '',
    '', `Nombre: ${data.name}`,
    `Entrega: ${data.zone === 'capital' ? 'Corrientes capital' : `Interior · ${data.city}`}`,
    data.note ? `Comentario: ${data.note}` : '',

}

function readCheckout() {
  const f = $('#co-form'); if (!f) return null;
  const fd = new FormData(f);
  return { name: String(fd.get('name') || '').trim(), zone: fd.get('zone') || 'capital', city: String(fd.get('city') || '').trim(), note: String(fd.get('note') || '').trim() };
}
function validateCheckout(show) {
  const d = readCheckout(); if (!d) return null;
  const errs = {};
  if (d.name.length < 2) errs.name = 'Escribí tu nombre para saber a quién le respondemos.';
  if (d.zone === 'interior' && d.city.length < 2) errs.city = 'Escribí la localidad del interior.';
  if (show) {
    [['name', 'co-name'], ['city', 'co-city']].forEach(([k, id]) => {
      const el = $('#' + id); if (!el) return;
      el.setAttribute('aria-invalid', errs[k] ? 'true' : 'false');
      $('#' + id + '-err').textContent = errs[k] || '';
    });
  }
  return { d, errs };
}
function syncCheckoutLink() {
  const d = readCheckout(); if (!d) return;
  state.checkout = d;
  $('#co-send').href = waLink(orderMessage(d));
  $('#city-fld').hidden = d.zone !== 'interior';
}

/* --- Ayuda y 404 --- */
function viewHelp() {
  const legal = [
    { icon: 'return', title: 'Botón de arrepentimiento', text: 'Para pedir la cancelación de una compra. Se habilita cuando se definan las condiciones de venta.' },
    { icon: 'info', title: 'Términos, privacidad y defensa del consumidor', text: 'Textos legales a completar antes de publicar la tienda.' },
  ];
  return `<div class="wrap page-pad">
    <h1 class="page-h1" id="page-title" tabindex="-1">Cómo comprar</h1>
    <p class="lead" style="margin-top:12px">Armás el pedido acá, lo enviás por WhatsApp y coordinamos precio, pago y envío con vos.</p>
    <div class="help-list">
      ${SERVICES.filter(s => s.confirmed || CONFIG.showPendingServices).map(s => `<section class="help-item" id="${s.id}"><span class="svc-ico">${icon(s.icon, 22)}</span><div><h2>${s.title}</h2><p>${s.confirmed ? s.text : s.placeholder}</p>${s.confirmed ? '' : pendingTag}</div></section>`).join('')}
      ${legal.map(s => `<section class="help-item"><span class="svc-ico">${icon(s.icon, 22)}</span><div><h2>${s.title}</h2><p>${s.text}</p>${pendingTag}</div></section>`).join('')}
      <section class="help-item"><span class="svc-ico">${icon('chat', 22)}</span><div><h2>Contacto</h2><p>WhatsApp <b style="color:var(--fg)">${CONFIG.whatsapp.display}</b> · Instagram <a href="${CONFIG.instagram.url}" target="_blank" rel="noopener" style="color:var(--mint);font-weight:800">${CONFIG.instagram.handle}</a></p></div></section>
    </div>
  </div>`;
}
function viewNotFound(msg = 'La página que buscás no existe.') {
  return `<div class="wrap page-pad"><h1 class="sr-only" id="page-title" tabindex="-1">Página no encontrada</h1><div class="empty">${cloud('var(--fog)')}<h2>${msg}</h2><p>Volvé al catálogo para seguir mirando.</p><div class="empty-actions"><a class="btn btn-primary" href="#catalogo">Ver productos</a></div></div></div>`;
}

/* ---------------- enrutado ---------------- */
function parseRoute() {
  let h = ''; try { h = decodeURIComponent((location.hash || '').slice(1)); } catch { h = ''; }
  if (!h || h === 'inicio') return { name: 'home' };
  if (h === 'catalogo') return { name: 'catalog' };
  if (h.startsWith('marca-')) return { name: 'catalog', preset: { brand: h.slice(6) } };
  if (h.startsWith('producto-')) return { name: 'product', id: h.slice(9) };
  if (h === 'carrito') return { name: 'cart' };
  if (h === 'checkout') return { name: 'checkout' };
  if (h === 'ayuda') return { name: 'help' };
  return { name: 'notfound' };
}
function go(hash) { if ((location.hash || '').slice(1) === hash) handleRoute(); else location.hash = hash; }
const TITLES = { home: () => `${CONFIG.brand} · Vapers originales en Corrientes`, catalog: () => `${BRANDS.find(b => b.id === state.filters.brand)?.name || 'Productos'} · ${CONFIG.brand}`, product: () => `${byId(state.route.id)?.name || 'Producto'} · ${CONFIG.brand}`, cart: () => `Tu pedido · ${CONFIG.brand}`, checkout: () => `Enviar pedido · ${CONFIG.brand}`, help: () => `Cómo comprar · ${CONFIG.brand}`, notfound: () => `No encontrado · ${CONFIG.brand}` };
let firstRender = true;
function handleRoute() {
  closeLayer(true); hideSuggest();
  const r = parseRoute(); state.route = r;
  if (r.name === 'catalog') { state.filters = { ...DEFAULT_FILTERS, ...(r.preset || {}), ...(state.pending || {}) }; state.pending = null; }
  renderView(true);
  if (!state.products && !state.loadingPromise) state.loadingPromise = load().then(() => { state.loadingPromise = null; renderView(false); });
}
function renderView(toTop) {
  const r = state.route;
  const view = { home: viewHome, catalog: viewCatalog, product: viewProduct, cart: viewCart, checkout: viewCheckout, help: viewHelp, notfound: viewNotFound }[r.name] || viewNotFound;
  $('#app').innerHTML = `<div class="view view-${r.name}">${view()}</div>`;
  if (r.name === 'catalog') renderResults();
  $$('.nav a').forEach(a => {
    const k = a.dataset.nav;
    const on = (k === 'catalog' && r.name === 'catalog' && state.filters.brand === 'all') || (k === `brand-${state.filters.brand}` && r.name === 'catalog') || (k === 'help' && r.name === 'help');
    on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  });
  document.title = (TITLES[r.name] || TITLES.notfound)();
  setupBuybar();
  if (toTop) {
    window.scrollTo(0, 0);
    if (!firstRender) { const h = $('#page-title'); h && h.focus({ preventScroll: true }); }
    firstRender = false;
  }
}
let buyObs = null;
function setupBuybar() {
  if (buyObs) { buyObs.disconnect(); buyObs = null; }
  document.documentElement.classList.remove('has-buybar');
  const row = $('#buy-row'), bar = $('#buybar'); if (!row || !bar || !('IntersectionObserver' in window)) return;
  buyObs = new IntersectionObserver(([e]) => {
    const on = !e.isIntersecting && e.boundingClientRect.top < 0;
    bar.classList.toggle('is-on', on); bar.setAttribute('aria-hidden', String(!on));
    const b = bar.querySelector('button'); if (b) b.tabIndex = on ? 0 : -1;
    document.documentElement.classList.toggle('has-buybar', on && innerWidth < 900);
  });
  buyObs.observe(row);
}

/* ---------------- capas ---------------- */
function openLayer(name, trigger) {
  closeLayer(true); hideSuggest();
  const el = $('#layer-' + name); if (!el) return;
  state.layer = name; state.lastFocus = trigger || document.activeElement;
  if (name === 'cart') $('#cart-inner').innerHTML = cartDrawerHTML();
  el.classList.add('is-open'); $('#scrim').classList.add('is-open'); document.documentElement.classList.add('lock');
  setTimeout(() => {
    if (name === 'search') { const i = $('#sp-q'); renderSuggest(i.value, 'sp-results'); i.focus(); }
    else { const f = el.querySelector('button, a[href], input'); f && f.focus({ preventScroll: true }); }
  }, 60);
}
function closeLayer(silent) {
  if (!state.layer) return;
  const el = $('#layer-' + state.layer); el && el.classList.remove('is-open');
  $('#scrim').classList.remove('is-open'); document.documentElement.classList.remove('lock');
  state.layer = null;
  if (!silent && state.lastFocus && document.contains(state.lastFocus)) state.lastFocus.focus({ preventScroll: true });
}
function trapFocus(e) {
  if (!state.layer || e.key !== 'Tab') return;
  const el = $('#layer-' + state.layer); if (!el) return;
  const f = $$('a[href], button:not([disabled]), input, select, textarea', el).filter(n => n.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---------------- búsqueda ---------------- */
function searchMatches(q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  return (state.products || PRODUCTS).filter(p => { const hay = norm(`${p.name} ${brandName(p.brand)}`); return terms.every(t => hay.includes(t)); }).sort((a, b) => a.rank - b.rank);
}
function highlight(name, q) {
  const t = norm(q).trim(); if (!t) return esc(name);
  const i = norm(name).indexOf(t); if (i < 0) return esc(name);
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + t.length)) + '</mark>' + esc(name.slice(i + t.length));
}
function suggestHTML(q) {
  if (!q.trim()) return `<p class="sug-label">Marcas</p><div class="sug-chips">${BRANDS.map(b => `<a class="seg-btn" href="#marca-${b.id}">${b.name}</a>`).join('')}<a class="seg-btn" href="#catalogo">Todos</a></div>`;
  const m = searchMatches(q);
  if (!m.length) return `<p class="sug-empty">Sin resultados para “${esc(q)}”. Probá con Elf Bar o Ignite.</p>`;
  return `<p class="sug-label">Productos</p>${m.slice(0, 6).map(p => `<a class="sug-row" href="#producto-${p.id}"><span class="sug-thumb"><img src="${p.img}" alt="" loading="lazy"></span><span><span class="sug-name">${highlight(p.name, q)}</span><span class="sug-sub">${brandName(p.brand)} · ${hasPrice(p) ? money(effPrice(p)) : 'Consultá precio'}</span></span></a>`).join('')}
  <button class="sug-all" data-action="search-all" data-q="${esc(q)}">Ver ${plural(m.length, 'resultado', 'resultados')} ${icon('arrow', 16)}</button>`;
}
function renderSuggest(q, target) {
  const el = $('#' + target); if (!el) return;
  if (target === 'hdr-suggest' && !q.trim()) { el.hidden = true; return; }
  el.innerHTML = target === 'sp-results' ? `<div class="suggest">${suggestHTML(q)}</div>` : suggestHTML(q);
  el.hidden = false;
}
function hideSuggest() { const el = $('#hdr-suggest'); if (el) el.hidden = true; }
function searchFor(q) { state.pending = { q: q.trim() }; const i = $('#hdr-q'); if (i) i.value = ''; go('catalogo'); }

/* ---------------- carrito ---------------- */
function saveCart() { store.set('chill-cart-v1', state.cart); }
function addToCart(id, qty = 1, flavor = '') {
  const p = byId(id); if (!p || stockState(p) === 'out') return 0;
  flavor = flavor.trim().slice(0, 60);
  const max = typeof p.stock === 'number' ? p.stock : 20;
  const inCart = state.cart.filter(l => l.id === id).reduce((a, l) => a + l.qty, 0);
  const add = Math.max(0, Math.min(qty, max - inCart));
  if (!add) { toast('Ya tenés el máximo disponible en tu pedido'); return 0; }
  const line = state.cart.find(l => l.id === id && (l.flavor || '') === flavor);
  if (line) line.qty += add; else state.cart.push({ id, flavor, qty: add });
  saveCart(); updateCartUI(true);
  return add;
}
function updateLine(key, fn) {
  const i = state.cart.findIndex(l => lineKey(l) === key); if (i < 0) return;
  const l = state.cart[i]; const p = byId(l.id) || PRODUCTS.find(x => x.id === l.id);
  const max = p && typeof p.stock === 'number' ? p.stock : 20;
  const next = fn(l.qty);
  if (next <= 0) state.cart.splice(i, 1); else l.qty = Math.min(next, max);
  saveCart(); updateCartUI(false);
}
function updateCartUI(bump) {
  const n = cartCount(); const b = $('#cart-count');
  b.textContent = n; b.hidden = !n;
  $('#cart-btn').setAttribute('aria-label', n ? `Pedido, ${plural(n, 'unidad', 'unidades')}` : 'Pedido vacío');
  if (bump) { b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  const a = document.activeElement;
  const sel = a && a.dataset && a.dataset.action && a.dataset.key ? `[data-action="${a.dataset.action}"][data-key="${CSS.escape(a.dataset.key)}"]` : null;
  const inDrawer = a && a.closest && a.closest('#layer-cart');
  $('#cart-inner').innerHTML = cartDrawerHTML();
  const r = state.route.name;
  if (r === 'cart' || r === 'product') renderView(false);
  if (r === 'checkout') { if (!cartLines().length) renderView(false); else { $('#co-summary').innerHTML = coSummaryInner(); syncCheckoutLink(); } }
  if (sel) { const node = $(sel, inDrawer ? $('#layer-cart') : $('#app')); if (node && !node.disabled) node.focus({ preventScroll: true }); else if (inDrawer) { const f = $('#layer-cart button'); f && f.focus(); } }
}

/* ---------------- toasts ---------------- */
function toast(msg, action) {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button data-action="${action.action}">${esc(action.label)}</button>` : ''}`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

/* ---------------- edad ---------------- */
function ageGate() {
  if (store.get('chill-age-ok', false)) return;
  const g = document.createElement('div'); g.className = 'age'; g.id = 'age';
  g.setAttribute('role', 'dialog'); g.setAttribute('aria-modal', 'true'); g.setAttribute('aria-labelledby', 'age-title');
  g.innerHTML = `<div class="age-card"><img src="logo.webp" alt="${esc(CONFIG.brand)}" width="399" height="329"><h2 id="age-title">¿Tenés ${CONFIG.minAge} años o más?</h2><p>Esta tienda vende productos con nicotina y es solo para mayores de ${CONFIG.minAge}.</p><div class="age-actions"><button class="btn btn-primary btn-block" data-action="age-yes">Sí, tengo ${CONFIG.minAge} o más</button><button class="btn btn-ghost btn-block" data-action="age-no">No</button></div></div>`;
  document.body.appendChild(g); document.documentElement.classList.add('lock');
  setTimeout(() => g.querySelector('button').focus(), 50);
}

/* ---------------- eventos ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) {
    const h = a.getAttribute('href'); const cur = location.hash || '#inicio';
    if (h === cur || (h === '#inicio' && !location.hash)) { e.preventDefault(); handleRoute(); }
    return;
  }
  const t = e.target.closest('[data-action]');
  if (!t) { if (!e.target.closest('.hdr-search')) hideSuggest(); return; }
  const act = t.dataset.action;
  const p = state.route.name === 'product' ? byId(state.route.id) : null;
  switch (act) {
    case 'open-menu': case 'open-search': case 'open-cart': case 'open-filters':
      openLayer(act.slice(5), t); break;
    case 'close-layer': closeLayer(); break;
    case 'account': closeLayer(true); toast('Por ahora no hace falta cuenta: armá tu pedido y envialo por WhatsApp.'); break;
    case 'quick-add': { const added = addToCart(t.dataset.id, 1); if (added) toast(`${byId(t.dataset.id).name} agregado`, { action: 'open-cart', label: 'Ver pedido' }); break; }
    case 'pdp-inc': state.pdp.qty++; renderView(false); $('[data-action="pdp-inc"]')?.focus(); break;
    case 'pdp-dec': state.pdp.qty = Math.max(1, state.pdp.qty - 1); renderView(false); $('[data-action="pdp-dec"]')?.focus(); break;
    case 'pdp-flavor': state.pdp.flavor = state.pdp.flavor === t.dataset.flavor ? '' : t.dataset.flavor; renderView(false); break;
    case 'pdp-tab': state.pdp.tab = t.dataset.tab; renderView(false); $('#tab-' + state.pdp.tab)?.focus(); break;
    case 'pdp-add': if (p) { const fl = $('#pdp-flavor') ? $('#pdp-flavor').value : state.pdp.flavor; if (addToCart(p.id, state.pdp.qty, fl)) { state.pdp.qty = 1; state.pdp.flavor = ''; renderView(false); openLayer('cart', $('#cart-btn')); } } break;
    case 'line-inc': updateLine(t.dataset.key, q => q + 1); break;
    case 'line-dec': updateLine(t.dataset.key, q => Math.max(1, q - 1)); break;
    case 'line-rm': updateLine(t.dataset.key, () => 0); toast('Producto eliminado del pedido'); break;
    case 'set-brand': state.filters.brand = t.dataset.brand; document.title = TITLES.catalog(); $('#page-title').textContent = brandName(state.filters.brand) || 'Productos'; renderResults(); break;
    case 'rm-filter': { const k = t.dataset.key; state.filters[k] = DEFAULT_FILTERS[k]; if (k === 'q') $('#cat-q').value = ''; if (k === 'brand') $('#page-title').textContent = 'Productos'; refreshFilterForm(); renderResults(); break; }
    case 'clear-filters': state.filters = { ...DEFAULT_FILTERS, sort: state.filters.sort }; $('#cat-q').value = ''; $('#page-title').textContent = 'Productos'; refreshFilterForm(); renderResults(); break;
    case 'clear-extra': state.filters.price = 'all'; state.filters.stock = false; refreshFilterForm(); renderResults(); break;
    case 'search-all': searchFor(t.dataset.q || ''); break;
    case 'retry': state.error = null; state.loadingPromise = load().then(() => { state.loadingPromise = null; renderView(false); }); renderView(false); break;
    case 'copy-order': {
      const v = validateCheckout(true); const text = orderMessage(v ? v.d : {});
      const done = () => { $('#co-status').className = 'co-status ok'; $('#co-status').textContent = `Pedido copiado. Pegalo en un chat con ${CONFIG.whatsapp.display}.`; };
      const fail = () => { $('#co-status').className = 'co-status'; $('#co-status').textContent = 'No se pudo copiar automáticamente. Seleccioná el número y escribinos.'; const r = document.createRange(); r.selectNodeContents($('#wa-num')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(text).then(done, fail); } catch { fail(); }
      break;
    }
    case 'age-yes': store.set('chill-age-ok', true); $('#age')?.remove(); document.documentElement.classList.remove('lock'); break;
    case 'age-no': $('#age .age-card').innerHTML = `<img src="logo.webp" alt="${esc(CONFIG.brand)}" width="399" height="329"><h2 id="age-title">Volvé cuando tengas ${CONFIG.minAge}</h2><p>Esta tienda es solo para mayores de ${CONFIG.minAge} años.</p><div class="age-actions"><button class="btn btn-ghost btn-block" data-action="age-back">Me equivoqué, volver</button></div>`; setTimeout(() => $('#age [data-action="age-back"]')?.focus(), 30); break;
    case 'age-back': $('#age')?.remove(); ageGate(); break;
  }
});
let qTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-search-input]')) renderSuggest(t.value, t.dataset.target);
  if (t.id === 'cat-q') { clearTimeout(qTimer); qTimer = setTimeout(() => { state.filters.q = t.value.trim(); renderResults(); }, 140); }
  if (t.id === 'pdp-flavor') { state.pdp.flavor = t.value; const p = byId(state.route.id); const c = $('#pdp-consult'); if (p && c) c.href = waLink(`Hola Chill! Quería consultar por ${p.name}${t.value.trim() ? ` (sabor: ${t.value.trim()})` : ''}. ¿Qué sabores tienen y cuál es el precio?`); }
  if (t.closest('#co-form')) { syncCheckoutLink(); if (t.getAttribute('aria-invalid') === 'true') validateCheckout(true); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('#filter-form')) { const fd = new FormData($('#filter-form')); state.filters.price = fd.get('price') || 'all'; state.filters.stock = fd.get('stock') === 'on'; renderResults(); }
  if (t.id === 'sort') { state.filters.sort = t.value; renderResults(); }
  if (t.closest('#co-form')) syncCheckoutLink();
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'search') { const q = f.querySelector('input').value; searchFor(q); }
});
document.addEventListener('click', e => {
  const send = e.target.closest('#co-send'); if (!send) return;
  const v = validateCheckout(true);
  const st = $('#co-status');
  if (!v || Object.keys(v.errs).length) {
    e.preventDefault(); st.className = 'co-status err'; st.textContent = 'Revisá los datos marcados antes de enviar.';
    const first = $('#co-form [aria-invalid="true"]'); first && first.focus();
    return;
  }
  syncCheckoutLink();
  const pay = PAYMENTS.createCheckout(v.d); if (pay.ok && pay.url) { e.preventDefault(); location.href = pay.url; return; }
  st.className = 'co-status ok'; st.textContent = 'Abrimos WhatsApp con tu pedido armado. Solo falta tocar Enviar en el chat.';
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (state.layer) closeLayer(); hideSuggest(); }
  trapFocus(e);
  if (e.target.matches && e.target.matches('[role="tab"]') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { state.pdp.tab = state.pdp.tab === 'desc' ? 'specs' : 'desc'; renderView(false); $('#tab-' + state.pdp.tab)?.focus(); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'hdr-q' && e.target.value) renderSuggest(e.target.value, 'hdr-suggest'); });
window.addEventListener('hashchange', handleRoute);

/* ---------------- inicio ---------------- */
$('#hdr').innerHTML = headerHTML();
$('#overlays').innerHTML = overlaysHTML();
$('#ftr').innerHTML = footerHTML();
updateCartUI(false);
handleRoute();
ageGate();

</script>
</body>
